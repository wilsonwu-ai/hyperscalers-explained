<figure class="fig" id="fig-backlog" aria-labelledby="fig-backlog-t">
  <p class="fig-title" id="fig-backlog-t">The four biggest backlogs add up to years of revenue already signed</p>
  <p class="fig-sub">Backlog is work customers have signed for but the company has not yet delivered. Bar length is dollars; the note by each name is years of current revenue.</p>
  <p class="fig-backlog-callout"><span class="fig-backlog-big" data-k="backlog.big4_total_b" data-f="t2">$2.49T</span><span class="fig-backlog-callout-t">is the four largest backlogs added together: Microsoft, Oracle, Amazon and Alphabet. Oracle's equals <span data-k="backlog.rows[name=Oracle].years_of_revenue" data-f="y1">8.6 years</span> of its current revenue, Microsoft's <span data-k="backlog.rows[name=Microsoft].years_of_revenue" data-f="y1">1.9 years</span>.</span></p>
  <div class="chart" id="fig-backlog-chart" role="img" aria-label="Horizontal bar chart of signed cloud backlog. Microsoft, Oracle, Amazon and Alphabet each have hundreds of billions of dollars signed, far more than the newer GPU clouds CoreWeave and Nebius. Relative to current revenue, Oracle, CoreWeave and Nebius have the most work waiting."></div>
  <div class="fallback"><!-- TABLE:backlog --></div>
  <figcaption>Source: company SEC filings. Backlog as of 30 September 2026 for Microsoft, Amazon and Alphabet, 31 August 2026 for Oracle, and 30 June 2026 for CoreWeave and Nebius. Interim figures unaudited. Microsoft's fiscal year ends June 30 and Oracle's May 31. Years of revenue = backlog divided by the latest quarter's revenue times 4 (AWS revenue for Amazon and Google Cloud revenue for Alphabet, where nearly all their backlog sits; total company revenue for the others). Microsoft's and Oracle's backlogs cover all their contracts, not only cloud.</figcaption>
</figure>
