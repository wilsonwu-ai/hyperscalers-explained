  <p class="fig-title" id="fig-campus-t">A 1 GW AI campus would cost about <span data-k="campus.capex_b" data-f="b1">$52.6B</span> to build, and would need about <span data-k="campus.breakeven_revenue_b" data-f="b2">$8.55B</span> a year in revenue to cover its costs before interest</p>
  <p class="fig-sub">Illustrative model, not a forecast. Read down: money comes in, each cost comes off, and what is left is profit. Pick a revenue case, a way of paying for the build and how long the chips last.</p>

  <p class="fig-campus-gloss">GW is a gigawatt, a billion watts: here, the power the computers inside would use. A GPU is the kind of chip used for AI. EBITDA is cash profit before depreciation and interest. Depreciation spreads the cost of buildings and chips over the years they stay useful. Payback is how many years of cash profit it takes to earn back the build cost.</p>
