<figure class="fig" id="fig-scenarios" aria-labelledby="fig-scenarios-t">
  <p class="fig-title" id="fig-scenarios-t">Four futures hang on two questions: does AI revenue keep pace, and do chips last and money stay cheap?</p>
  <p class="fig-sub">These are scenarios, not forecasts. An asset life is how many years equipment stays useful before it is replaced.</p>
  <p class="fig-scenarios-hint" hidden>Tap a box to see what to watch for.</p>
  <div class="fig-scenarios-grid">
    <div class="fig-scenarios-colhead fig-scenarios-ch1">AI revenue slows</div>
    <div class="fig-scenarios-colhead fig-scenarios-ch2">AI revenue keeps pace</div>
    <div class="fig-scenarios-axis-x" aria-hidden="true"></div>
    <div class="fig-scenarios-rowhead fig-scenarios-rh1">Long asset lives, cheap money</div>
    <div class="fig-scenarios-rowhead fig-scenarios-rh2">Short lives, costly money</div>
    <div class="fig-scenarios-axis-y" aria-hidden="true"></div>

    <button type="button" class="fig-scenarios-cell fig-scenarios-utility" data-id="utility">
      <span class="fig-scenarios-name">The new utility</span>
      <span class="fig-scenarios-what">Backlog would convert on time; capex would stay high but earn its keep; margins would hold near today's.</span>
      <span class="fig-scenarios-watch"><strong>What to watch:</strong> Backlog turning into revenue on schedule; GPU rental prices holding</span>
    </button>
    <button type="button" class="fig-scenarios-cell fig-scenarios-squeeze" data-id="squeeze">
      <span class="fig-scenarios-name">The margin squeeze</span>
      <span class="fig-scenarios-what">Demand would be real, but faster chip cycles and higher rates would eat profit; cash-rich giants would gain share.</span>
      <span class="fig-scenarios-watch"><strong>What to watch:</strong> Useful-life cuts; bond spreads and default-swap prices</span>
    </button>
    <button type="button" class="fig-scenarios-cell fig-scenarios-digestion" data-id="digestion">
      <span class="fig-scenarios-name">Digestion</span>
      <span class="fig-scenarios-what">Too much capacity for a while; prices would fall, capex would be cut, customers would win, as with fiber after 2001.</span>
      <span class="fig-scenarios-watch"><strong>What to watch:</strong> Capex guidance cuts; on-demand GPU prices falling</span>
    </button>
    <button type="button" class="fig-scenarios-cell fig-scenarios-bust" data-id="bust">
      <span class="fig-scenarios-name">The bust</span>
      <span class="fig-scenarios-what">Write-downs and defaults among debt-funded builders; the giants would lean on their other businesses.</span>
      <span class="fig-scenarios-watch"><strong>What to watch:</strong> Neocloud refinancing; lease cancellations; impairment charges</span>
    </button>
  </div>
  <p class="sr-only fig-scenarios-live" aria-live="polite"></p>
  <figcaption>Source: the author's scenario analysis, built on the company filings and news listed in the sources section. Scenarios, not forecasts.</figcaption>
</figure>
