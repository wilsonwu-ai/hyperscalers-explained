<figure class="fig" id="fig-forces" aria-labelledby="fig-forces-t">
  <p class="fig-title" id="fig-forces-t">Suppliers have the most power over the cloud giants, and substitutes the least</p>
  <p class="fig-sub">Porter's five forces is a checklist of the pressures that can squeeze a company's profit. More filled dots means more pressure.</p>
  <ul class="fig-forces-grid" role="list">
    <li class="fig-forces-card fig-forces-rivalry" data-i="0">
      <div class="fig-forces-head">
        <div>
          <p class="fig-forces-name">Rivalry</p>
          <p class="fig-forces-plain">How hard today's players fight each other</p>
        </div>
        <span class="fig-forces-meter" aria-hidden="true"><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot"></span></span>
      </div>
      <p class="fig-forces-level"><span data-k="forces[0].level" data-f="raw">4</span> of 5, <span class="fig-forces-word">high</span></p>
      <p class="fig-forces-why">Three giants hold 61% and fight on AI capacity, price and chips; Oracle and neoclouds add supply.</p>
    </li>
    <li class="fig-forces-card fig-forces-entrants" data-i="1">
      <div class="fig-forces-head">
        <div>
          <p class="fig-forces-name">New entrants</p>
          <p class="fig-forces-plain">How easily newcomers can join in</p>
        </div>
        <span class="fig-forces-meter" aria-hidden="true"><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot"></span><span class="fig-forces-dot"></span></span>
      </div>
      <p class="fig-forces-level"><span data-k="forces[1].level" data-f="raw">3</span> of 5, <span class="fig-forces-word">medium</span></p>
      <p class="fig-forces-why">GPU clouds can start fast with debt, but full-service cloud takes decades and hundreds of billions.</p>
    </li>
    <li class="fig-forces-card fig-forces-supplier" data-i="2">
      <div class="fig-forces-head">
        <div>
          <p class="fig-forces-name">Supplier power</p>
          <p class="fig-forces-plain">How much the sellers of chips and power can charge</p>
        </div>
        <span class="fig-forces-meter" aria-hidden="true"><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot is-on"></span></span>
      </div>
      <p class="fig-forces-level"><span data-k="forces[2].level" data-f="raw">5</span> of 5, <span class="fig-forces-word">very high</span></p>
      <p class="fig-forces-why">NVIDIA keeps 75% gross margins; turbines and grid connections are scarce too.</p>
    </li>
    <li class="fig-forces-card fig-forces-buyer" data-i="3">
      <div class="fig-forces-head">
        <div>
          <p class="fig-forces-name">Buyer power</p>
          <p class="fig-forces-plain">How much the biggest customers can demand</p>
        </div>
        <span class="fig-forces-meter" aria-hidden="true"><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot"></span></span>
      </div>
      <p class="fig-forces-level"><span data-k="forces[3].level" data-f="raw">4</span> of 5, <span class="fig-forces-word">high</span></p>
      <p class="fig-forces-why">A few AI labs sign the largest contracts; CoreWeave's top customer is 36% of revenue.</p>
    </li>
    <li class="fig-forces-card fig-forces-substitutes" data-i="4">
      <div class="fig-forces-head">
        <div>
          <p class="fig-forces-name">Substitutes</p>
          <p class="fig-forces-plain">Other ways to get the same job done</p>
        </div>
        <span class="fig-forces-meter" aria-hidden="true"><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot is-on"></span><span class="fig-forces-dot"></span><span class="fig-forces-dot"></span><span class="fig-forces-dot"></span></span>
      </div>
      <p class="fig-forces-level"><span data-k="forces[4].level" data-f="raw">2</span> of 5, <span class="fig-forces-word">low</span></p>
      <p class="fig-forces-why">Own data centers, custom chips and smaller open models can replace some rented compute.</p>
    </li>
  </ul>
  <figcaption>Source: the author's assessment on a 1 to 5 scale, built on Synergy Research Group market shares and the latest NVIDIA and CoreWeave filings. Levels are judgment, not measurements. Interim figures unaudited.</figcaption>
</figure>
