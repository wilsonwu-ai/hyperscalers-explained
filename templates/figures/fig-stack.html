<figure class="fig" id="fig-stack" aria-labelledby="fig-stack-t">
  <p class="fig-title" id="fig-stack-t">Five layers stack up under the customer, and a different set of companies earns at each one</p>
  <p class="fig-sub">Read from the bottom up. Tap a layer to see what it is.</p>
  <ol class="fig-stack-layers">
    <li class="fig-stack-layer fig-stack-power">
      <button type="button" class="fig-stack-btn" aria-expanded="true" aria-controls="fig-stack-d1">
        <span class="fig-stack-n">Land and power</span>
        <span class="fig-stack-who"><span class="fig-stack-k">Who earns here:</span> utilities and turbine makers</span>
      </button>
      <p class="fig-stack-detail" id="fig-stack-d1">Every campus starts with a plot of land and a connection to the electric grid, so power often decides where it gets built.</p>
    </li>
    <li class="fig-stack-layer fig-stack-buildings">
      <button type="button" class="fig-stack-btn" aria-expanded="true" aria-controls="fig-stack-d2">
        <span class="fig-stack-n">Buildings and cooling</span>
        <span class="fig-stack-who"><span class="fig-stack-k">Who earns here:</span> data center landlords such as Equinix and Digital Realty</span>
      </button>
      <p class="fig-stack-detail" id="fig-stack-d2">Giant sheds with cooling and backup power. Some companies build their own, and others rent space from a landlord.</p>
    </li>
    <li class="fig-stack-layer fig-stack-chips">
      <button type="button" class="fig-stack-btn" aria-expanded="true" aria-controls="fig-stack-d3">
        <span class="fig-stack-n">Chips and servers</span>
        <span class="fig-stack-who"><span class="fig-stack-k">Who earns here:</span> NVIDIA and TSMC</span>
      </button>
      <p class="fig-stack-detail" id="fig-stack-d3">GPUs are chips built for AI work. Servers are the machines that hold them, stacked in racks.</p>
    </li>
    <li class="fig-stack-layer fig-stack-compute">
      <button type="button" class="fig-stack-btn" aria-expanded="true" aria-controls="fig-stack-d4">
        <span class="fig-stack-n">Network and storage</span>
        <span class="fig-stack-who"><span class="fig-stack-k">Who earns here:</span> the cloud companies, as part of the same machine</span>
      </button>
      <p class="fig-stack-detail" id="fig-stack-d4">Cables, switches and disks that tie thousands of chips together so they work as one machine.</p>
    </li>
    <li class="fig-stack-layer fig-stack-compute">
      <button type="button" class="fig-stack-btn" aria-expanded="true" aria-controls="fig-stack-d5">
        <span class="fig-stack-n">Cloud software and AI services</span>
        <span class="fig-stack-who"><span class="fig-stack-k">Who earns here:</span> AWS, Microsoft Azure, Google Cloud, Oracle, CoreWeave</span>
      </button>
      <p class="fig-stack-detail" id="fig-stack-d5">What customers actually rent, by the hour or by contract: from plain computing to ready-made AI tools.</p>
    </li>
    <li class="fig-stack-layer fig-stack-cash">
      <button type="button" class="fig-stack-btn" aria-expanded="true" aria-controls="fig-stack-d6">
        <span class="fig-stack-n">Customers</span>
        <span class="fig-stack-who"><span class="fig-stack-k">Who pays:</span> AI labs, banks, streaming services</span>
      </button>
      <p class="fig-stack-detail" id="fig-stack-d6">Whoever rents the computing. Their payments flow back down the stack to everyone below.</p>
    </li>
  </ol>
  <figcaption>Source: the author's simplified map of the value chain. Company names are examples, not a complete list.</figcaption>
</figure>
